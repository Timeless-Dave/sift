# Two listeners, one app:
#   8080  published. Browsers connect directly; X-Forwarded-For from them is never trusted.
#   8081  internal only (not published). The https profile's caddy connects here and is
#         the only hop allowed to say who the client is.

# Outer scheme for the API: caddy sends X-Forwarded-Proto on 8081; direct clients use ours.
map $server_port $forwarded_proto {
  8081    $http_x_forwarded_proto;
  default $scheme;
}

server {
  listen 8080;
  include /etc/nginx/sift/site.conf;
}

server {
  listen 8081;
  # Only containers on the compose network can reach this port, and only caddy does.
  # Caddy replaces any client-sent X-Forwarded-For with the address it saw.
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;
  include /etc/nginx/sift/site.conf;
}
