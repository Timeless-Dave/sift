# Outer scheme for the API: the https profile's caddy sets X-Forwarded-Proto, direct
# clients don't, so fall back to nginx's own scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  "~.+" $http_x_forwarded_proto;
}

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 13m;

  # Trust the outer client IP only from the Docker network (the https profile's
  # caddy). Direct browser X-Forwarded-For is ignored, so it can't spoof rate limits.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location /api/ {
    include /etc/nginx/conf.d/security-headers.conf;
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 90s;
  }

  location = /sw.js {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri /index.html;
  }
}
