# Shared by both listeners in nginx.conf.
server_tokens off;
root /usr/share/nginx/html;
client_max_body_size 13m;

location /api/ {
  include /etc/nginx/sift/security-headers.conf;
  proxy_pass http://api:8000/;
  proxy_set_header Host $host;
  # One address: the client as nginx knows it (the TCP peer, or caddy's word on 8081).
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header X-Request-ID $request_id;
  proxy_read_timeout 90s;
}

# add_header is not inherited into a location that sets its own, so every location
# includes the security headers.
location = /sw.js {
  include /etc/nginx/sift/security-headers.conf;
  add_header Cache-Control "no-cache" always;
}
location /assets/ {
  include /etc/nginx/sift/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location / {
  include /etc/nginx/sift/security-headers.conf;
  try_files $uri /index.html;
}
