# Two containers: the PWA behind nginx, and the API. nginx proxies /api to the API,
# so the browser only ever talks to one origin.
services:
  api:
    build: ./api
    env_file: ./api/.env
    environment:
      SIFT_ENV: production
      # Must override the relative dev path in .env: the root filesystem is read-only.
      SIFT_DB: /data/sift.db
      SIFT_TRUST_PROXY: "1"
      SIFT_CORS: http://localhost:8080
      SIFT_REDIS_URL: redis://redis:6379/0
    volumes:
      - sift-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  # Optional rate-limit store: no published port, reachable only by the api service.
  # Persistence is off (limits are ephemeral) so the read-only filesystem is fine.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sift-data:
