# Chicken: freshness has published phone-camera evidence; cultured-vs-conventional has none
# and stays research.
id: chicken
name: Chicken
category: meat
aliases: [chicken, chicken breast, chicken meat, poultry]
# Open Food Facts category tags that map a scanned barcode to this profile.
off_category_tags: [en:chickens, en:poultries]
scan:
  modalities: [torch, vibration]
  placement: Hold the phone over the chicken pack so the camera sees the meat through the film.
summary: >
  The torch reading captures the meat's surface colour and sheen through the pack film while the
  vibration reading senses firmness. The pattern is compared with genuine chicken scanned on the
  same kind of phone.
targets:
  - id: freshness
    kind: freshness
    question: Is this chicken still fresh, or is it spoiling?
    status: experimental
    signals:
      torch: Fresh chicken is pale pink and turns dull grey-green with a slimy sheen as it spoils.
      vibration: Spoilage softens the flesh and wets the surface, changing how the pack damps vibration.
    likely_causes:
      - Meat going off
      - A different cut or rearing method than the references
      - Freezer burn or drying, which also dull the surface
    references:
      - title: Classification of Chicken Meat Freshness using Convolutional Neural Network Algorithms
        source: IEEE 3ICT conference, 2020
        url: https://openalex.org/works/W3118596929
        finding: Smartphone photos of broiler breasts, fresh vs rotten, classified by the Ayam6Net CNN at 92.9%
                 accuracy.
      - title: Chicken Meat Freshness Identification using Colors and Textures Feature
        source: IEEE ICIEV conference, 2018
        url: https://simpeg.polinema.ac.id/upload_dir/filePenelitian/132310111/10-10_1109iciev_2018_8640992.pdf
        finding: The smartphone-camera set (150 images, uncontrolled light) reached only 58.33% 3-class accuracy, far
                 below the 98% webcam set with fixed light.
  - id: cultured-vs-conventional
    kind: cultured
    question: Is this cultivated (lab-grown) chicken rather than conventional chicken?
    status: research
    signals:
      torch: No published study shows a phone photo separating cultured from conventional chicken; scans build the
             reference library.
    likely_causes:
      - Genuinely cultivated meat
      - Conventional meat from a different breed, feed or cut than the references
      - Processing or packaging differences
    references:
      - title: Review of analytical methods for cell-cultivated products
        source: UK Food Standards Agency, 2026
        url: https://science.food.gov.uk/article/167297-review-of-analytical-methods-for-cell-cultivated-products
        finding: The review finds no single lab method reliably authenticates cultivated meat, no validated methods
                 exist, and no phone-based method is covered.
references:
  - title: Classification of Chicken Meat Freshness using Convolutional Neural Network Algorithms
    source: IEEE 3ICT conference, 2020
    url: https://openalex.org/works/W3118596929
    finding: Smartphone photos of broiler breasts, fresh vs rotten, classified by the Ayam6Net CNN at 92.9% accuracy.
  - title: Review of analytical methods for cell-cultivated products
    source: UK Food Standards Agency, 2026
    url: https://science.food.gov.uk/article/167297-review-of-analytical-methods-for-cell-cultivated-products
    finding: The review finds no single lab method reliably authenticates cultivated meat, no validated methods exist,
             and no phone-based method is covered.
limits:
  - Opaque trays and printed film block the view; scan where the meat shows through clear film.
  - Needs genuine reference scans from the same phone model before it gives a match result.
