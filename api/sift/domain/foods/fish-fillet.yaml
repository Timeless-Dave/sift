# Fresh fish fillet: species substitution and freshness grading both have a published
# smartphone-image study (salmon vs rainbow trout).
id: fish-fillet
name: Fresh fish fillet
category: fish
aliases: [fish fillet, fresh fish, fish, salmon fillet]
# Open Food Facts category tags that map a scanned barcode to this profile.
off_category_tags: [en:fishes]
scan:
  modalities: [torch, vibration, contact]
  placement: Hold the phone over the fillet pack, then press the camera flat on the film over the flesh.
summary: >
  The torch reading captures the flesh colour, marbling and sheen through the pack film while the
  vibration reading senses firmness. The pattern is compared with genuine fillets of the same
  species scanned on the same kind of phone.
targets:
  - id: species-substitution
    kind: identity
    question: Is this fillet the species on the label, or a cheaper substitute?
    status: experimental
    signals:
      torch: Species differ in flesh colour, fat marbling and grain, which the camera reads directly.
    likely_causes:
      - A cheaper species substituted for the labelled one
      - Farmed vs wild fish of the same species
      - Dyed fish (e.g. trout dyed to look like salmon)
    references:
      - title: A Deep Learning-Based Sensing System for Identifying Salmon and Rainbow Trout Meat and Grading Freshness
               for Consumer Protection
        source: Sensors (MDPI), 2025
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12567205/
        finding: Smartphone RGB photos of steak, fillet and sashimi cuts classified fish meat types at 84.58% with an
                 improved DenseNet121, but only for salmon vs rainbow trout so far.
  - id: freshness
    kind: freshness
    question: Is this fillet still fresh, or is it going stale?
    status: experimental
    signals:
      torch: Fresh fillet flesh is bright and glossy and dulls toward grey with age and poor storage.
      vibration: Fresh flesh is firm and springs back while stale flesh stays soft, damping vibration differently.
      contact: Myoglobin and haemoglobin oxidation and deoxygenation change how tissue absorbs red and green light
               scattered a few millimetres in, and spoilage changes scattering.
    likely_causes:
      - Fish going stale
      - Previously frozen fish sold as fresh
      - A different species or cut than the references
    references:
      - title: A Deep Learning-Based Sensing System for Identifying Salmon and Rainbow Trout Meat and Grading Freshness
               for Consumer Protection
        source: Sensors (MDPI), 2025
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12567205/
        finding: The same two-stage model graded salmon freshness into 3 levels at 73.75%, and stayed robust to blur and
                 small tilts but not to varied lighting or packaging.
      - title: An innovative approach to near-infrared spectroscopy using a standard mobile device and its clinical
               application in the real-time visualization of peripheral veins
        source: BMC Medical Informatics and Decision Making, 2014
        url: https://doi.org/10.1186/s12911-014-0100-z
        finding: A phone-driven prototype (external NIR-modified camera, 740 nm LEDs) located veins 35.2% more
                 successfully than nursing students over 500 attempts; shows light scattered through tissue carries
                 absorption contrast, though Sift uses the visible band.
references:
  - title: A Deep Learning-Based Sensing System for Identifying Salmon and Rainbow Trout Meat and Grading Freshness for
           Consumer Protection
    source: Sensors (MDPI), 2025
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12567205/
    finding: Smartphone RGB photos of steak, fillet and sashimi cuts classified fish meat types at 84.58% with an
             improved DenseNet121, but only for salmon vs rainbow trout so far.
limits:
  - Evidence covers salmon and rainbow trout only; other species need their own reference scans.
  - Needs genuine reference scans from the same phone model before it gives a match result.
